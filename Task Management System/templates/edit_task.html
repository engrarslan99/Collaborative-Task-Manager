<!DOCTYPE html>
<html>

<head>
    <title>Edit Task</title>
    <link type="text/css" href="{{ url_for('static', path='/styles.css') }}" rel="stylesheet" />
    <script type="module" src="{{ url_for('static', path='/firebase-login.js') }}"></script>
</head>

<body>
    <div id="login-box">
        Email:<input type="email" name="" id="email"><br />
        Password: <input type="password" name="" id="password"><br />
        <button id="login">Login</button>
        <button id="sign-up">Sign Up</button>
    </div>

    <div
        style="display: flex; flex-direction: column; align-items: flex-start; position: absolute; top: 0; left: 0; padding: 8px;">
        <p style="margin: 0 0 4px 0; font-weight: bold;">{{ user_token.email }}</p>
        <button id="sign-out" style="padding: 5px 10px; font-size: 15px; line-height: 1;">Sign out</button>
    </div>

    {% if user_token %}
    <h2>Edit Task</h2>
    <a href="/" style="font-weight: bold; text-decoration: underline;">Back to Boards</a></br>
    <br />

    <form action="/board/{{ board_id }}/task/{{ task.id }}/edit" method="post">
        <h3 for="task_title">Task Title:</h3>
        <input type="text" name="task_title" value="{{ task.data.title }}" required
            style="padding: 8px 10px; font-size: 13px; line-height: 1.2; width: 180px;">

        <h3 for="due_date">Due Date:</h3>
        <input type="date" name="due_date" value="{{ task.data.due_date }}" required
            style="padding: 6px 8px; font-size: 13px; line-height: 1.2; width: 180px;">

        <h3 for="assigned_to">Assign to:</h3>
        <div style="display: flex; flex-direction: column; gap: 4px;">
            {% for member in board_members %}
            <label style="font-size: 14px;">
                <input type="checkbox" name="assigned_to" value="{{ member }}" 
                    {% if member in (task.data.assigned_to or []) %}checked{% endif %}>
                {{ member }}
            </label>
            {% endfor %}
        </div>
        <br />

        <input type="submit" value="Save Changes"
            style="padding: 8px 10px; font-size: 15px; line-height: 1.2; cursor: pointer;">
    </form>
    {% endif %}
</body>

</html>
